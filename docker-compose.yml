
services:
  # ── PostgreSQL ────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: devpulse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: devpulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI (Webhook + REST API) ──────────────────────────
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: devpulse_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Django Dashboard ──────────────────────────────────────
  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    container_name: devpulse_dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./services/dashboard:/app
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8080

  # ── Celery Worker ─────────────────────────────────────────
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: devpulse_worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./services/worker:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A tasks worker --loglevel=info --concurrency=2 -Q celery,review,default

  # ── Celery Flower (monitoring UI) ─────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: devpulse_flower
    restart: unless-stopped
    env_file: .env
    environment:
      CELERY_BROKER_URL: ${REDIS_URL}
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  pg_data: