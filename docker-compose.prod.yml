
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: devpulse_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devpulse_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/${GITHUB_OWNER}/devpulse-api:latest
    container_name: devpulse_api
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /app/entrypoint.sh

  dashboard:
    image: ghcr.io/${GITHUB_OWNER}/devpulse-dashboard:latest
    container_name: devpulse_dashboard
    restart: always
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    command: /app/entrypoint.sh

  worker:
    image: ghcr.io/${GITHUB_OWNER}/devpulse-worker:latest
    container_name: devpulse_worker
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A tasks worker --loglevel=info --concurrency=2 -Q review,default

  flower:
    image: mher/flower:2.0
    container_name: devpulse_flower
    restart: always
    environment:
      CELERY_BROKER_URL: ${REDIS_URL}
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  pg_data: